# Central LLM configuration for all agents and crews.
#
# Priority chain (highest wins):
#   constructor args  >  agents.yaml llm_config block  >  this file per-agent
#   >  environment variables  >  this file global defaults
#
# Environment variable overrides (global):
#   LLM_PROVIDER      — e.g. openai | anthropic | ollama | azure | groq | mistral
#   LLM_MODEL         — e.g. gpt-4o | claude-sonnet-4-6 | llama3
#   LLM_TEMPERATURE   — float 0-1
#   LLM_MAX_TOKENS    — integer
#   EMBEDDER_PROVIDER — e.g. openai | azure | ollama
#   EMBEDDER_MODEL    — e.g. text-embedding-3-small

# ── Global defaults ────────────────────────────────────────────────────────────
global:
  provider: openai
  model: gpt-5.6-luna
  # No temperature override: gpt-5.6-luna rejects any value other than its
  # own default (1) — "Unsupported value: 'temperature' does not support 0.1
  # with this model" on every call, self-corrected by the reactive fallback
  # in base_agent.py but at the cost of one doomed request per agent. Fixed
  # here at the source for a model we already know rejects it; the reactive
  # fallback stays in place for any other model that turns out to as well.
  max_tokens: 16000
  timeout: 120        # seconds before LLM call is aborted
  max_retries: 3      # retry attempts on transient errors

# ── Per-agent overrides ────────────────────────────────────────────────────────
# Set only the values that differ from the global defaults above.
# Recognised keys: provider, model, temperature, max_tokens
#
# Examples:
#   data_collector:
#     model: gpt-4o-mini        # cheaper model for data-fetching tasks
#
#   investment_advisor:
#     temperature: 0.0          # deterministic output for financial advice
#
#   technical_analyst:
#     provider: anthropic
#     model: claude-haiku-4-5-20251001
agents:
  investment_advisor:
    model: gpt-5.6-terra     # or: provider: anthropic / model: claude-sonnet-4-6
    # No temperature override, for the same reason as the global default:
    # gpt-5.6-terra also only accepts its own default temperature (1).
    # "Deterministic output for the buy/sell/hold call" was the intent, but
    # this model has no lever for that — every request was rejected and
    # silently retried without it, same call cost as the unset default.
  report_generator:
    model: gpt-5.6-luna      # or: provider: anthropic / model: claude-sonnet-4-6


# ── Provider → LiteLLM model-string prefix mapping ────────────────────────────
# LiteLLM expects  "<prefix><model-name>"  e.g. "openai/gpt-4o".
# Add new providers here without changing any Python code.
provider_prefixes:
  openai: "openai/"
  anthropic: "anthropic/"
  ollama: "ollama/"
  azure: "azure/"
  groq: "groq/"
  mistral: "mistral/"
  cohere: "cohere/"
  bedrock: "bedrock/"
  huggingface: "huggingface/"
  vertexai: "vertexai/"
  gemini: "gemini/"
  deepseek: "deepseek/"
  openrouter: "openrouter/"
  xai: "xai/"
  perplexity: "perplexity/"
  fireworks_ai: "fireworks_ai/"
  together_ai: "together_ai/"
  cerebras: "cerebras/"
  # Any provider not listed here still works — unlisted providers fall back
  # to the "<provider>/" convention automatically (BaseAgent._build_llm).
  # Add an entry only if a provider's LiteLLM prefix differs from its name.
