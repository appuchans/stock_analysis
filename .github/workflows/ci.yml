name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: comprehensive_stock_analysis

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (network-free)
        run: pytest -m "not slow" -q
        env:
          # The suite is fully mocked; a dummy key keeps any preflight/config
          # path from short-circuiting.
          OPENAI_API_KEY: ci-not-a-real-key

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        # black/isort are pinned because they are blocking: an unpinned
        # formatter release would fail CI on a version bump alone, with no
        # code change. Bump these deliberately, reformatting in the same PR.
        run: pip install black==26.5.1 isort==8.0.1 flake8 mypy

      # Formatting is blocking as of the one-time reformat pass — the tree is
      # clean, so any failure here is real drift. Run `black src/ tests/` and
      # `isort src/ tests/` to fix.
      - name: black
        run: black --check src/ tests/
      - name: isort
        run: isort --check-only src/ tests/

      # flake8 is blocking as of the 2026-08 backlog cleanup (was ~204
      # findings, now zero). Run `flake8 src/` locally before pushing.
      - name: flake8
        run: flake8 src/

      # Still advisory: mypy has never been run clean under the strict config.
      # Promote by removing continue-on-error once its backlog is worked
      # through (see docs/PHASES.md).
      - name: mypy
        continue-on-error: true
        run: mypy src/
